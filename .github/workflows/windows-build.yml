name: Build AnyPS5 Windows 11 (Relinker Only)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      # Мы НЕ качаем сабмодули, чтобы CMake даже не пытался трогать FFmpeg

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-toolchain

    - name: Configure CMake
      shell: msys2 {0}
      run: |
        cmake -S . -B build-relinker -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=gcc \
          -DCMAKE_CXX_COMPILER=g++ \
          -DANYPS5_RELINKER_ONLY=ON \
          -DBUILD_TESTING=OFF

    - name: Build Relinker
      shell: msys2 {0}
      run: cmake --build build-relinker --parallel 4

    - name: Prepare Artifacts
      shell: bash
      run: |
        mkdir release_dist
        cp build-relinker/core/relinker/relinker.exe release_dist/

    - name: Upload Windows Build
      uses: actions/upload-artifact@v4
      with:
        name: anyps5-relinker-windows
        path: release_dist/
